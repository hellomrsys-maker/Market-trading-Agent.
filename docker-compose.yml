version: '3.8'

services:
  agent:
    build: .
    container_name: optionalpha-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ALPACA_API_KEY=${ALPACA_API_KEY:-paper_demo_key}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-paper_demo_secret}
      - ALPACA_PAPER=true
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8080
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
